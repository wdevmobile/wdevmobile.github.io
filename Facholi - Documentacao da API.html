  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<title>Documentação Técnica — API de Originação · Facholi<\u002Ftitle>\n<style>\n  :root{\n    --green-900:#0E3A1B;\n    --green-800:#134A22;\n    --green-700:#195C27;\n    --green-600:#1E6B30;\n    --green-500:#23813C;\n    --green-400:#2E8B4F;\n    --leaf:#7AC143;\n    --ink:#1c2620;\n    --muted:#5c6b62;\n    --line:#dfe6e0;\n    --bg-soft:#f4f7f4;\n    --bg-card:#ffffff;\n    --get:#1e7d46;\n    --post:#1f6fb2;\n    --put:#b9821a;\n    --del:#b23b3b;\n  }\n\n  @page{\n    size:A4;\n    margin:20mm 15mm 18mm 15mm;\n  }\n\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    font-family:\"Segoe UI\",\"Helvetica Neue\",Arial,sans-serif;\n    color:var(--ink);\n    font-size:10.5pt;\n    line-height:1.55;\n    -webkit-print-color-adjust:exact;\n    print-color-adjust:exact;\n  }\n\n  /* ===== Running header / footer (repeated on every page) ===== */\n  .run-header{\n    position:fixed; top:-15mm; left:0; right:0; height:11mm;\n    display:flex; align-items:center; justify-content:space-between;\n    font-size:7.5pt; letter-spacing:.14em; text-transform:uppercase;\n    color:var(--green-700); font-weight:700;\n    border-bottom:1.5px solid var(--leaf);\n    padding-bottom:2mm;\n  }\n  .run-header .rh-right{color:var(--muted); font-weight:600;}\n  .run-footer{\n    position:fixed; bottom:-13mm; left:0; right:0; height:9mm;\n    display:flex; align-items:center; justify-content:space-between;\n    font-size:7.5pt; color:var(--muted);\n    border-top:1px solid var(--line); padding-top:2mm;\n  }\n  .run-footer .ico-leaf{color:var(--green-500);font-weight:800;}\n\n  /* ===== Cover (full bleed, hides header/footer) ===== */\n  .cover{\n    position:relative; z-index:50;\n    width:210mm; height:297mm;\n    margin:-20mm -15mm 0 -15mm;\n    background:linear-gradient(160deg,var(--green-600) 0%,var(--green-800) 55%,var(--green-900) 100%);\n    color:#fff; overflow:hidden;\n    padding:34mm 24mm;\n    display:flex; flex-direction:column;\n  }\n  .cover::before{\n    content:\"\"; position:absolute; right:-60mm; top:-40mm;\n    width:160mm; height:160mm; border-radius:50%;\n    background:rgba(255,255,255,.05);\n  }\n  .cover::after{\n    content:\"\"; position:absolute; left:-50mm; bottom:-70mm;\n    width:150mm; height:150mm; border-radius:50%;\n    background:rgba(122,193,67,.10);\n  }\n  .cover-logo{height:100%; margin-bottom:4mm; position:relative; z-index:2;}\n  .cover-kicker{\n    position:relative; z-index:2;\n    font-size:9pt; letter-spacing:.32em; text-transform:uppercase;\n    color:var(--leaf); font-weight:700; margin-top:40mm;\n  }\n  .cover-title{\n    position:relative; z-index:2;\n    font-size:40pt; line-height:1.05; font-weight:800; margin:6mm 0 0;\n    letter-spacing:-.5px;\n  }\n  .cover-sub{\n    position:relative; z-index:2;\n    font-size:14pt; font-weight:400; color:rgba(255,255,255,.85);\n    margin-top:5mm; max-width:130mm;\n  }\n  .cover-spacer{flex:1;}\n  .cover-meta{\n    position:relative; z-index:2;\n    display:flex; gap:0; border:1px solid rgba(255,255,255,.25);\n    border-radius:8px; overflow:hidden; max-width:150mm;\n  }\n  .cover-meta .cell{padding:6mm 8mm; flex:1;}\n  .cover-meta .cell + .cell{border-left:1px solid rgba(255,255,255,.25);}\n  .cover-meta .lbl{font-size:7.5pt; letter-spacing:.2em; text-transform:uppercase; color:var(--leaf); font-weight:700;}\n  .cover-meta .val{font-size:12pt; font-weight:600; margin-top:2mm;}\n  .cover-foot{\n    position:relative; z-index:2;\n    margin-top:8mm; font-size:8.5pt; color:rgba(255,255,255,.6);\n  }\n\n  /* ===== Section structure ===== */\n  .section{break-before:page;}\n  .sec-head{\n    display:flex; align-items:baseline; gap:5mm;\n    border-bottom:2px solid var(--green-600);\n    padding-bottom:3mm; margin-bottom:6mm;\n  }\n  .sec-num{\n    font-size:30pt; font-weight:800; color:var(--leaf);\n    line-height:1; letter-spacing:-1px;\n  }\n  .sec-title{font-size:19pt; font-weight:700; color:var(--green-800); margin:0;}\n  .sec-intro{color:var(--muted); margin:-2mm 0 6mm; font-size:10.5pt;}\n\n  h3{font-size:13pt; color:var(--green-700); margin:7mm 0 2mm; font-weight:700;}\n  h4{font-size:11pt; color:var(--green-800); margin:5mm 0 1mm; font-weight:700;}\n  p{margin:0 0 3mm;}\n  ul,ol{margin:0 0 4mm; padding-left:6mm;}\n  li{margin-bottom:1.5mm;}\n  strong{color:var(--ink);}\n  code{\n    font-family:\"Cascadia Code\",\"Consolas\",monospace; font-size:9pt;\n    background:var(--bg-soft); border:1px solid var(--line);\n    border-radius:4px; padding:.5mm 1.5mm; color:var(--green-800);\n  }\n\n  /* ===== Tables ===== */\n  table{width:100%; border-collapse:collapse; margin:3mm 0 5mm; font-size:9pt;}\n  th{\n    background:var(--green-700); color:#fff; text-align:left;\n    padding:2.4mm 3mm; font-weight:600; font-size:8.5pt;\n    letter-spacing:.02em;\n  }\n  td{padding:2.2mm 3mm; border-bottom:1px solid var(--line); vertical-align:top;}\n  tr:nth-child(even) td{background:var(--bg-soft);}\n  table.fields td:first-child{font-family:\"Consolas\",monospace; color:var(--green-800); white-space:nowrap;}\n  .req{color:var(--del); font-weight:700;}\n  .opt{color:var(--muted);}\n\n  /* ===== Cards / callouts ===== */\n  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:5mm; margin:4mm 0;}\n  .card{\n    background:var(--bg-card); border:1px solid var(--line);\n    border-radius:8px; padding:5mm; break-inside:avoid;\n  }\n  .card .c-title{font-weight:700; color:var(--green-800); margin-bottom:2mm; font-size:11pt;}\n  .card .c-tag{\n    display:inline-block; font-size:7.5pt; letter-spacing:.12em; text-transform:uppercase;\n    color:var(--green-600); font-weight:700; margin-bottom:1mm;\n  }\n  .callout{\n    border-left:4px solid var(--leaf); background:#f1f7ec;\n    padding:4mm 5mm; border-radius:0 6px 6px 0; margin:4mm 0; break-inside:avoid;\n  }\n  .callout.warn{border-left-color:var(--put); background:#fbf4e6;}\n  .callout.info{border-left-color:var(--post); background:#eef4fa;}\n  .callout .ct{font-weight:700; color:var(--green-800); margin-bottom:1mm;}\n  .callout.warn .ct{color:#8a6212;}\n  .callout.info .ct{color:#235a8c;}\n\n  /* ===== Endpoint blocks ===== */\n  .ep{\n    border:1px solid var(--line); border-radius:8px; margin:0 0 4mm;\n    overflow:hidden; break-inside:avoid;\n  }\n  .ep-head{\n    display:flex; align-items:center; gap:3mm;\n    background:var(--bg-soft); padding:2.6mm 4mm; border-bottom:1px solid var(--line);\n  }\n  .verb{\n    font-family:\"Consolas\",monospace; font-weight:700; font-size:8pt;\n    color:#fff; padding:1mm 2.5mm; border-radius:4px; letter-spacing:.04em;\n    min-width:15mm; text-align:center;\n  }\n  .verb.get{background:var(--get);}\n  .verb.post{background:var(--post);}\n  .verb.put{background:var(--put);}\n  .verb.delete{background:var(--del);}\n  .ep-path{font-family:\"Consolas\",monospace; font-size:9.5pt; font-weight:600; color:var(--ink);}\n  .ep-auth{margin-left:auto; font-size:7.5pt; font-weight:700; letter-spacing:.08em; text-transform:uppercase;}\n  .ep-auth.admin{color:var(--del);}\n  .ep-auth.auth{color:var(--green-600);}\n  .ep-auth.public{color:var(--muted);}\n  .ep-body{padding:3.5mm 4mm;}\n  .ep-body p{margin:0 0 2mm;}\n  .ep-body .lbl{font-size:7.5pt; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-top:2mm;}\n\n  .toc-list{list-style:none; padding:0; margin:6mm 0;}\n  .toc-list li{\n    display:flex; align-items:baseline; padding:3mm 0; border-bottom:1px solid var(--line);\n    font-size:11.5pt;\n  }\n  .toc-num{color:var(--leaf); font-weight:800; width:12mm; font-size:13pt;}\n  .toc-name{font-weight:600; color:var(--green-800);}\n  .toc-dots{flex:1; border-bottom:1.5px dotted var(--line); margin:0 3mm 1.5mm;}\n\n  .pill{display:inline-block; background:var(--green-600); color:#fff; font-size:8pt; font-weight:600; padding:.6mm 2.5mm; border-radius:20px; letter-spacing:.03em;}\n  .muted{color:var(--muted);}\n  .nowrap{white-space:nowrap;}\n\n  /* ===== Screen presentation (paper sheets on a desk) ===== */\n  @media screen{\n    html{background:#dce2dc;}\n    body{\n      background:#dce2dc;\n      padding:32px 16px 56px;\n    }\n    /* Running header/footer are print-only artifacts */\n    .run-header,.run-footer{display:none;}\n\n    /* Cover and each section read as their own A4 sheet, centered, with a gap */\n    .cover,\n    .section{\n      width:210mm;\n      max-width:100%;\n      margin:0 auto 28px;\n      box-shadow:0 8px 32px rgba(14,58,27,.16);\n      border-radius:4px;\n      overflow:hidden;\n    }\n    .cover{\n      height:auto;\n      min-height:297mm;\n    }\n    .section{\n      background:var(--bg-card);\n      padding:24mm 20mm;\n      break-before:auto;\n    }\n    .section:last-child{margin-bottom:0;}\n  }\n\n  @media screen and (max-width:840px){\n    .cover,.section{padding-left:14mm; padding-right:14mm;}\n    .grid2{grid-template-columns:1fr;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- Running header & footer (repeat every page; covered by the cover page) -->\n<div class=\"run-header\">\n  <span>Grupo Facholi · Sementes e Nutrição<\u002Fspan>\n  <span class=\"rh-right\">Documentação Técnica — API de Originação<\u002Fspan>\n<\u002Fdiv>\n<div class=\"run-footer\">\n  <span>API de Originação de Gado · v1<\u002Fspan>\n  <span><span class=\"ico-leaf\">✦<\u002Fspan> Confidencial — Uso interno<\u002Fspan>\n<\u002Fdiv>\n\n<!-- ============ COVER ============ -->\n<div class=\"cover\">\n  <img class=\"cover-logo\" src=\"d63f7145-515e-4704-9028-d30dc83d081c\" alt=\"Facholi — Sementes e Nutrição\">\n  <div class=\"cover-kicker\">Documentação Técnica de API<\u002Fdiv>\n  <div class=\"cover-title\">API de Originação<br>de Gado<\u002Fdiv>\n  <div class=\"cover-sub\">Referência técnica completa: arquitetura, autenticação, modelo de dados, endpoints e regras de cálculo da plataforma de originação Facholi.<\u002Fdiv>\n  <div class=\"cover-spacer\"><\u002Fdiv>\n  <div class=\"cover-meta\">\n    <div class=\"cell\"><div class=\"lbl\">Documento<\u002Fdiv><div class=\"val\">Referência Técnica da API<\u002Fdiv><\u002Fdiv>\n    <div class=\"cell\"><div class=\"lbl\">Versão<\u002Fdiv><div class=\"val\">v1 · 2026<\u002Fdiv><\u002Fdiv>\n    <div class=\"cell\"><div class=\"lbl\">Plataforma<\u002Fdiv><div class=\"val\">ASP.NET Core 8<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cover-foot\">© 2026 Grupo Facholi — Sementes e Nutrição. Distribuição restrita à equipe técnica.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ SUMÁRIO ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">—<\u002Fdiv>\n    <h1 class=\"sec-title\">Sumário<\u002Fh1>\n  <\u002Fdiv>\n  <p class=\"sec-intro\">Navegue pelas seções para localizar rapidamente as informações técnicas da API.<\u002Fp>\n  <ul class=\"toc-list\">\n    <li><span class=\"toc-num\">01<\u002Fspan><span class=\"toc-name\">Visão Geral<\u002Fspan><span class=\"toc-dots\"><\u002Fspan><span class=\"muted\">Propósito e capacidades<\u002Fspan><\u002Fli>\n    <li><span class=\"toc-num\">02<\u002Fspan><span class=\"toc-name\">Arquitetura e Tecnologias<\u002Fspan><span class=\"toc-dots\"><\u002Fspan><span class=\"muted\">Stack e camadas<\u002Fspan><\u002Fli>\n    <li><span class=\"toc-num\">03<\u002Fspan><span class=\"toc-name\">Autenticação e Autorização<\u002Fspan><span class=\"toc-dots\"><\u002Fspan><span class=\"muted\">JWT e perfis<\u002Fspan><\u002Fli>\n    <li><span class=\"toc-num\">04<\u002Fspan><span class=\"toc-name\">Convenções da API<\u002Fspan><span class=\"toc-dots\"><\u002Fspan><span class=\"muted\">Erros, paginação, unidades<\u002Fspan><\u002Fli>\n    <li><span class=\"toc-num\">05<\u002Fspan><span class=\"toc-name\">Modelo de Dados<\u002Fspan><span class=\"toc-dots\"><\u002Fspan><span class=\"muted\">Entidades e campos<\u002Fspan><\u002Fli>\n    <li><span class=\"toc-num\">06<\u002Fspan><span class=\"toc-name\">Referência de Endpoints<\u002Fspan><span class=\"toc-dots\"><\u002Fspan><span class=\"muted\">Todos os recursos<\u002Fspan><\u002Fli>\n    <li><span class=\"toc-num\">07<\u002Fspan><span class=\"toc-name\">Regras de Cálculo e Negócio<\u002Fspan><span class=\"toc-dots\"><\u002Fspan><span class=\"muted\">Fórmulas e validações<\u002Fspan><\u002Fli>\n    <li><span class=\"toc-num\">08<\u002Fspan><span class=\"toc-name\">Execução e Configuração<\u002Fspan><span class=\"toc-dots\"><\u002Fspan><span class=\"muted\">Como rodar e Swagger<\u002Fspan><\u002Fli>\n    <li><span class=\"toc-num\">09<\u002Fspan><span class=\"toc-name\">Suporte e Considerações Finais<\u002Fspan><span class=\"toc-dots\"><\u002Fspan><span class=\"muted\">Contato<\u002Fspan><\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<!-- ============ 01 VISÃO GERAL ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"sec-num\">01<\u002Fdiv><h1 class=\"sec-title\">Visão Geral<\u002Fh1><\u002Fdiv>\n  <p class=\"sec-intro\">O que é a API e quais problemas ela resolve.<\u002Fp>\n\n  <p>A <strong>API de Originação de Gado<\u002Fstrong> (projeto <code>PrecoBoi.Api<\u002Fcode>) é o serviço de back-end da plataforma Facholi para apoio à compra e originação de bovinos. Ela centraliza cadastros de referência, o motor de <strong>simulação de preços de praça<\u002Fstrong>, a gestão do ciclo de vida das <strong>negociações<\u002Fstrong> e os <strong>dashboards<\u002Fstrong> analíticos consumidos pelo aplicativo web (PWA).<\u002Fp>\n\n  <h3>Principais capacidades<\u002Fh3>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"c-tag\">Cadastros<\u002Fdiv><div class=\"c-title\">Dados de referência<\u002Fdiv>Corretores, municípios de origem/destino, categorias de gado, ICMS por UF, cotações regionais e configuração de comissão — com trilha de auditoria.<\u002Fdiv>\n    <div class=\"card\"><div class=\"c-tag\">Simulação<\u002Fdiv><div class=\"c-title\">Preço de praça<\u002Fdiv>Cálculo do preço na praça a partir do preço colocado (descontando frete, ICMS e comissão) e rankings de oportunidades de compra por origem.<\u002Fdiv>\n    <div class=\"card\"><div class=\"c-tag\">Negociações<\u002Fdiv><div class=\"c-title\">Ciclo de compra<\u002Fdiv>Criação, edição, fechamento e controle de entregas das negociações, com cálculo automático do preço colocado por item.<\u002Fdiv>\n    <div class=\"card\"><div class=\"c-tag\">Dashboards<\u002Fdiv><div class=\"c-title\">Indicadores<\u002Fdiv>Consolidação de volumes e preços médios ponderados por comprador, corretor e categoria.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout info\">\n    <div class=\"ct\">Glossário rápido<\u002Fdiv>\n    <strong>Praça:<\u002Fstrong> preço de referência na região de origem. &nbsp;•&nbsp;\n    <strong>Colocado:<\u002Fstrong> preço posto na fazenda (R$/kg). &nbsp;•&nbsp;\n    <strong>Arroba (@):<\u002Fstrong> 30&nbsp;kg. &nbsp;•&nbsp;\n    <strong>Ágio/Deságio:<\u002Fstrong> diferença percentual frente à cotação da praça.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 02 ARQUITETURA ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"sec-num\">02<\u002Fdiv><h1 class=\"sec-title\">Arquitetura e Tecnologias<\u002Fh1><\u002Fdiv>\n  <p class=\"sec-intro\">Stack tecnológico e organização em camadas.<\u002Fp>\n\n  <h3>Stack<\u002Fh3>\n  <table>\n    <tbody><tr><th style=\"width:38%\">Componente<\u002Fth><th>Tecnologia<\u002Fth><\u002Ftr>\n    <tr><td>Plataforma / runtime<\u002Ftd><td>.NET 8 — ASP.NET Core Web API<\u002Ftd><\u002Ftr>\n    <tr><td>Acesso a dados<\u002Ftd><td>Dapper (micro-ORM) sobre Npgsql<\u002Ftd><\u002Ftr>\n    <tr><td>Banco de dados<\u002Ftd><td>PostgreSQL (colunas em <code>snake_case<\u002Fcode> mapeadas para <code>PascalCase<\u002Fcode>)<\u002Ftd><\u002Ftr>\n    <tr><td>Autenticação<\u002Ftd><td>JWT Bearer (HMAC-SHA256)<\u002Ftd><\u002Ftr>\n    <tr><td>Hash de senha<\u002Ftd><td>BCrypt<\u002Ftd><\u002Ftr>\n    <tr><td>Documentação<\u002Ftd><td>OpenAPI 3 via Swashbuckle (Swagger UI)<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Organização em camadas<\u002Fh3>\n  <table>\n    <tbody><tr><th style=\"width:30%\">Camada<\u002Fth><th>Responsabilidade<\u002Fth><\u002Ftr>\n    <tr><td><strong>Controllers<\u002Fstrong><\u002Ftd><td>Recebem requisições HTTP, validam o contexto do usuário e delegam para serviços/repositórios.<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Services<\u002Fstrong><\u002Ftd><td>Regras de negócio e cálculos: <code>AuthService<\u002Fcode>, <code>CalculoService<\u002Fcode>, <code>NegociacaoService<\u002Fcode>.<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Repositories<\u002Fstrong><\u002Ftd><td>Acesso a dados com Dapper; uma classe por agregado.<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Models<\u002Fstrong><\u002Ftd><td>Entidades de domínio persistidas.<\u002Ftd><\u002Ftr>\n    <tr><td><strong>DTOs<\u002Fstrong><\u002Ftd><td>Contratos de entrada/saída (request/response) expostos pela API.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <div class=\"callout\">\n    <div class=\"ct\">CORS<\u002Fdiv>\n    A API libera origens configuradas para o front-end (PWA), permitindo qualquer cabeçalho/método e credenciais. As origens permitidas são definidas por configuração de ambiente.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 03 AUTENTICAÇÃO ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"sec-num\">03<\u002Fdiv><h1 class=\"sec-title\">Autenticação e Autorização<\u002Fh1><\u002Fdiv>\n  <p class=\"sec-intro\">Como obter e usar o token de acesso.<\u002Fp>\n\n  <h3>Fluxo de autenticação<\u002Fh3>\n  <ol>\n    <li>O cliente envia e-mail e senha para <code>POST /api/auth/login<\u002Fcode>.<\u002Fli>\n    <li>A API valida as credenciais (senha conferida via BCrypt) e o status ativo do usuário.<\u002Fli>\n    <li>Em caso de sucesso, retorna um <strong>token JWT<\u002Fstrong> assinado, além de nome, e-mail, perfil e id.<\u002Fli>\n    <li>O cliente envia o token nas requisições seguintes no cabeçalho <code>Authorization: Bearer &lt;token&gt;<\u002Fcode>.<\u002Fli>\n  <\u002Fol>\n\n  <div class=\"callout info\">\n    <div class=\"ct\">Claims do token<\u002Fdiv>\n    O JWT carrega <code>NameIdentifier<\u002Fcode> (id), <code>Name<\u002Fcode> (nome), <code>Email<\u002Fcode> e <code>Role<\u002Fcode> (perfil). O perfil determina o acesso às operações administrativas.\n  <\u002Fdiv>\n\n  <h3>Perfis de acesso<\u002Fh3>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"c-tag\">Perfil<\u002Fdiv><div class=\"c-title\">Administrador<\u002Fdiv>Acesso total: gestão de usuários, todos os cadastros de referência, configuração de comissão e consulta à auditoria.<\u002Fdiv>\n    <div class=\"card\"><div class=\"c-tag\">Perfil<\u002Fdiv><div class=\"c-title\">Comprador<\u002Fdiv>Operação de negociações, simulações e dashboards. Pode editar/excluir apenas as negociações que criou.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <table>\n    <tbody><tr><th>Tipo de operação<\u002Fth><th>Acesso exigido<\u002Fth><\u002Ftr>\n    <tr><td>Login e diagnóstico de fuso horário<\u002Ftd><td><span class=\"ep-auth public\">Público<\u002Fspan><\u002Ftd><\u002Ftr>\n    <tr><td>Leitura de cadastros, simulação, negociações, dashboards<\u002Ftd><td><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Ftd><\u002Ftr>\n    <tr><td>Escrita em cadastros, usuários e auditoria<\u002Ftd><td><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <div class=\"callout warn\">\n    <div class=\"ct\">Respostas de autenticação<\u002Fdiv>\n    Requisições sem token válido retornam <code>401 Unauthorized<\u002Fcode>. Usuários autenticados sem o perfil exigido recebem <code>403 Forbidden<\u002Fcode>.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 04 CONVENÇÕES ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"sec-num\">04<\u002Fdiv><h1 class=\"sec-title\">Convenções da API<\u002Fh1><\u002Fdiv>\n  <p class=\"sec-intro\">Padrões transversais a todos os endpoints.<\u002Fp>\n\n  <h3>Base e formato<\u002Fh3>\n  <ul>\n    <li>Todas as rotas têm o prefixo <code>/api<\u002Fcode> e trafegam <code>application/json<\u002Fcode>.<\u002Fli>\n    <li>Datas e horas seguem o fuso do servidor (America/São_Paulo).<\u002Fli>\n    <li>Valores monetários em Reais (R$). Preços de gado em <strong>R$/kg<\u002Fstrong> ou <strong>R$/@<\u002Fstrong> (arroba = 30&nbsp;kg).<\u002Fli>\n  <\u002Ful>\n\n  <h3>Tratamento de erros<\u002Fh3>\n  <p>Erros de negócio e validação retornam <code>400 Bad Request<\u002Fcode> com um corpo no formato:<\u002Fp>\n  <table>\n    <tbody><tr><th style=\"width:30%\">Campo<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td><code>mensagem<\u002Fcode><\u002Ftd><td>Texto explicativo do erro, adequado para exibição ao usuário.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Códigos de status usados<\u002Fh3>\n  <table>\n    <tbody><tr><th style=\"width:24%\">Código<\u002Fth><th>Significado<\u002Fth><\u002Ftr>\n    <tr><td><code>200 OK<\u002Fcode><\u002Ftd><td>Sucesso com corpo de resposta.<\u002Ftd><\u002Ftr>\n    <tr><td><code>201 Created<\u002Fcode><\u002Ftd><td>Recurso criado (retorna o recurso).<\u002Ftd><\u002Ftr>\n    <tr><td><code>204 No Content<\u002Fcode><\u002Ftd><td>Sucesso sem corpo (atualizações/exclusões).<\u002Ftd><\u002Ftr>\n    <tr><td><code>400 Bad Request<\u002Fcode><\u002Ftd><td>Dados inválidos ou regra de negócio violada.<\u002Ftd><\u002Ftr>\n    <tr><td><code>401 Unauthorized<\u002Fcode><\u002Ftd><td>Token ausente ou inválido.<\u002Ftd><\u002Ftr>\n    <tr><td><code>403 Forbidden<\u002Fcode><\u002Ftd><td>Sem permissão (perfil insuficiente).<\u002Ftd><\u002Ftr>\n    <tr><td><code>404 Not Found<\u002Fcode><\u002Ftd><td>Recurso não encontrado.<\u002Ftd><\u002Ftr>\n    <tr><td><code>409 Conflict<\u002Fcode><\u002Ftd><td>Conflito (ex.: e-mail já cadastrado).<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Paginação<\u002Fh3>\n  <p>Listagens paginadas aceitam <code>pagina<\u002Fcode> e <code>tamanhoPagina<\u002Fcode> na query string e retornam o envelope:<\u002Fp>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:30%\">Campo<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>items<\u002Ftd><td>Coleção de registros da página.<\u002Ftd><\u002Ftr>\n    <tr><td>total<\u002Ftd><td>Total de registros que atendem ao filtro.<\u002Ftd><\u002Ftr>\n    <tr><td>pagina<\u002Ftd><td>Página atual.<\u002Ftd><\u002Ftr>\n    <tr><td>tamanhoPagina<\u002Ftd><td>Quantidade de itens por página.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n\n<!-- ============ 05 MODELO DE DADOS ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"sec-num\">05<\u002Fdiv><h1 class=\"sec-title\">Modelo de Dados<\u002Fh1><\u002Fdiv>\n  <p class=\"sec-intro\">Principais entidades de domínio e seus campos.<\u002Fp>\n\n  <h4>Usuário<\u002Fh4>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:26%\">Campo<\u002Fth><th style=\"width:20%\">Tipo<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>id<\u002Ftd><td>int<\u002Ftd><td>Identificador.<\u002Ftd><\u002Ftr>\n    <tr><td>nome<\u002Ftd><td>string<\u002Ftd><td>Nome do usuário.<\u002Ftd><\u002Ftr>\n    <tr><td>email<\u002Ftd><td>string<\u002Ftd><td>E-mail (usado no login).<\u002Ftd><\u002Ftr>\n    <tr><td>telefone<\u002Ftd><td>string<\u002Ftd><td>Telefone de contato.<\u002Ftd><\u002Ftr>\n    <tr><td>perfil<\u002Ftd><td>string<\u002Ftd><td><code>Admin<\u002Fcode> ou <code>Comprador<\u002Fcode>.<\u002Ftd><\u002Ftr>\n    <tr><td>ativo<\u002Ftd><td>bool<\u002Ftd><td>Se pode acessar o sistema.<\u002Ftd><\u002Ftr>\n    <tr><td>criadoEm<\u002Ftd><td>datetime<\u002Ftd><td>Data de criação.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h4>Corretor<\u002Fh4>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:26%\">Campo<\u002Fth><th style=\"width:20%\">Tipo<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>id<\u002Ftd><td>int<\u002Ftd><td>Identificador.<\u002Ftd><\u002Ftr>\n    <tr><td>nome / telefone<\u002Ftd><td>string<\u002Ftd><td>Identificação e contato.<\u002Ftd><\u002Ftr>\n    <tr><td>municipio / uf<\u002Ftd><td>string<\u002Ftd><td>Localização do corretor.<\u002Ftd><\u002Ftr>\n    <tr><td>propriedade<\u002Ftd><td>string<\u002Ftd><td>Propriedade associada.<\u002Ftd><\u002Ftr>\n    <tr><td>observacoes<\u002Ftd><td>string<\u002Ftd><td>Anotações livres.<\u002Ftd><\u002Ftr>\n    <tr><td>ativo<\u002Ftd><td>bool<\u002Ftd><td>Status do corretor.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h4>Município de Origem<\u002Fh4>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:26%\">Campo<\u002Fth><th style=\"width:20%\">Tipo<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>nome / uf<\u002Ftd><td>string<\u002Ftd><td>Município e UF.<\u002Ftd><\u002Ftr>\n    <tr><td>distanciaKm<\u002Ftd><td>decimal<\u002Ftd><td>Distância até o destino (km).<\u002Ftd><\u002Ftr>\n    <tr><td>valorKm<\u002Ftd><td>decimal<\u002Ftd><td>Valor do frete por km.<\u002Ftd><\u002Ftr>\n    <tr><td>ativo<\u002Ftd><td>bool<\u002Ftd><td>Disponível para simulação/negociação.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h4>Categoria<\u002Fh4>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:26%\">Campo<\u002Fth><th style=\"width:20%\">Tipo<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>nome<\u002Ftd><td>string<\u002Ftd><td>Ex.: Bezerro, Garrote, Boi.<\u002Ftd><\u002Ftr>\n    <tr><td>pesoMin / pesoMax<\u002Ftd><td>decimal<\u002Ftd><td>Faixa de peso (kg).<\u002Ftd><\u002Ftr>\n    <tr><td>pesoMedio<\u002Ftd><td>decimal<\u002Ftd><td>Peso médio usado nos cálculos.<\u002Ftd><\u002Ftr>\n    <tr><td>cabCaminhao<\u002Ftd><td>int<\u002Ftd><td>Cabeças por caminhão (rateio do frete).<\u002Ftd><\u002Ftr>\n    <tr><td>ordem<\u002Ftd><td>int<\u002Ftd><td>Ordem de exibição.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h4>ICMS (por UF)<\u002Fh4>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:26%\">Campo<\u002Fth><th style=\"width:20%\">Tipo<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>uf<\u002Ftd><td>string<\u002Ftd><td>Unidade federativa.<\u002Ftd><\u002Ftr>\n    <tr><td>aliquota<\u002Ftd><td>decimal<\u002Ftd><td>Alíquota de ICMS.<\u002Ftd><\u002Ftr>\n    <tr><td>recuperacao<\u002Ftd><td>decimal<\u002Ftd><td>Percentual de recuperação.<\u002Ftd><\u002Ftr>\n    <tr><td>icmsEfetivo<\u002Ftd><td>decimal<\u002Ftd><td>ICMS efetivo aplicado no cálculo.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h4>Cotação Regional<\u002Fh4>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:26%\">Campo<\u002Fth><th style=\"width:20%\">Tipo<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>uf<\u002Ftd><td>string<\u002Ftd><td>UF da praça.<\u002Ftd><\u002Ftr>\n    <tr><td>pracaReferenciaUf<\u002Ftd><td>string?<\u002Ftd><td>UF de referência (opcional).<\u002Ftd><\u002Ftr>\n    <tr><td>valorArroba<\u002Ftd><td>decimal<\u002Ftd><td>Cotação da arroba (R$/@).<\u002Ftd><\u002Ftr>\n    <tr><td>agios[]<\u002Ftd><td>lista<\u002Ftd><td>Ágio percentual por categoria.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h4>Negociação &amp; Itens<\u002Fh4>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:26%\">Campo<\u002Fth><th style=\"width:20%\">Tipo<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>numero<\u002Ftd><td>string<\u002Ftd><td>Identificador legível <code>NNN/AAAA<\u002Fcode>.<\u002Ftd><\u002Ftr>\n    <tr><td>compradorId / corretorId<\u002Ftd><td>int<\u002Ftd><td>Partes da negociação.<\u002Ftd><\u002Ftr>\n    <tr><td>municipioOrigemId / destinoId<\u002Ftd><td>int<\u002Ftd><td>Rota da operação.<\u002Ftd><\u002Ftr>\n    <tr><td>dataPrevistaEntrega<\u002Ftd><td>datetime?<\u002Ftd><td>Previsão de entrega.<\u002Ftd><\u002Ftr>\n    <tr><td>status<\u002Ftd><td>string<\u002Ftd><td><code>EmNegociacao<\u002Fcode> ou <code>Fechado<\u002Fcode>.<\u002Ftd><\u002Ftr>\n    <tr><td>itens[ ].categoriaId<\u002Ftd><td>int<\u002Ftd><td>Categoria do item.<\u002Ftd><\u002Ftr>\n    <tr><td>itens[ ].qtdNegociada<\u002Ftd><td>int?<\u002Ftd><td>Cabeças negociadas.<\u002Ftd><\u002Ftr>\n    <tr><td>itens[ ].precoNegociado<\u002Ftd><td>decimal?<\u002Ftd><td>R$/kg na praça (origem).<\u002Ftd><\u002Ftr>\n    <tr><td>itens[ ].pesoMedio<\u002Ftd><td>decimal?<\u002Ftd><td>Peso médio do item.<\u002Ftd><\u002Ftr>\n    <tr><td>itens[ ].precoColocado<\u002Ftd><td>decimal?<\u002Ftd><td>R$/kg posto fazenda (calculado).<\u002Ftd><\u002Ftr>\n    <tr><td>itens[ ].qtdEntregue<\u002Ftd><td>int<\u002Ftd><td>Cabeças entregues.<\u002Ftd><\u002Ftr>\n    <tr><td>itens[ ].statusEntrega<\u002Ftd><td>string<\u002Ftd><td><code>Pendente<\u002Fcode> / <code>Parcial<\u002Fcode> / <code>Concluido<\u002Fcode>.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n\n<!-- ============ 06 ENDPOINTS ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"sec-num\">06<\u002Fdiv><h1 class=\"sec-title\">Referência de Endpoints<\u002Fh1><\u002Fdiv>\n  <p class=\"sec-intro\">Todos os recursos expostos, agrupados por área. Legenda de acesso: <span class=\"ep-auth public\">Público<\u002Fspan> &nbsp; <span class=\"ep-auth auth\">Autenticado<\u002Fspan> &nbsp; <span class=\"ep-auth admin\">Admin<\u002Fspan>.<\u002Fp>\n\n  <h3>Autenticação<\u002Fh3>\n  <div class=\"ep\">\n    <div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/auth/login<\u002Fspan><span class=\"ep-auth public\">Público<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Autentica e retorna o token JWT.<\u002Fp>\n      <div class=\"lbl\">Corpo<\u002Fdiv><p><code>email<\u002Fcode>, <code>senha<\u002Fcode><\u002Fp>\n      <div class=\"lbl\">Respostas<\u002Fdiv><p><code>200<\u002Fcode> token + dados · <code>401<\u002Fcode> credenciais inválidas/usuário inativo<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ep\">\n    <div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/auth/me<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Retorna os dados do usuário do token atual.<\u002Fp>\n      <div class=\"lbl\">Respostas<\u002Fdiv><p><code>200<\u002Fcode> usuário · <code>404<\u002Fcode> não encontrado<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>Usuários<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/usuarios<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Lista usuários. Filtro opcional <code>?ativo=true|false<\u002Fcode>.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/usuarios/{id}<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Obtém um usuário. <code>404<\u002Fcode> se não existir.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/usuarios<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Cria um usuário (senha armazenada com hash BCrypt).<\u002Fp>\n      <div class=\"lbl\">Corpo<\u002Fdiv><p><code>nome<\u002Fcode>, <code>email<\u002Fcode>, <code>senha<\u002Fcode>, <code>telefone<\u002Fcode>, <code>perfil<\u002Fcode>, <code>ativo<\u002Fcode><\u002Fp>\n      <div class=\"lbl\">Respostas<\u002Fdiv><p><code>201<\u002Fcode> criado · <code>409<\u002Fcode> e-mail já cadastrado<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb put\">PUT<\u002Fspan><span class=\"ep-path\">/api/usuarios/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Atualiza um usuário. A senha só muda se <code>senha<\u002Fcode> for informada.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb delete\">DELETE<\u002Fspan><span class=\"ep-path\">/api/usuarios/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Exclui um usuário.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <h3>Cadastros — Corretores<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/corretores<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Lista corretores. Filtro opcional <code>?ativo<\u002Fcode>.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/corretores/{id}<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Obtém um corretor.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/corretores<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Cria um corretor (gera auditoria).<\u002Fp>\n      <div class=\"lbl\">Corpo<\u002Fdiv><p><code>nome<\u002Fcode>, <code>telefone<\u002Fcode>, <code>municipio<\u002Fcode>, <code>uf<\u002Fcode>, <code>propriedade<\u002Fcode>, <code>observacoes<\u002Fcode>, <code>ativo<\u002Fcode><\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb put\">PUT<\u002Fspan><span class=\"ep-path\">/api/corretores/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Atualiza um corretor.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb delete\">DELETE<\u002Fspan><span class=\"ep-path\">/api/corretores/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Exclui um corretor.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <h3>Cadastros — Municípios<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/municipios-origem<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Lista municípios de origem (distância e valor por km). Filtro <code>?ativo<\u002Fcode>.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/municipios-origem/{id}<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Obtém um município de origem.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/municipios-origem<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Cria um município de origem.<\u002Fp>\n      <div class=\"lbl\">Corpo<\u002Fdiv><p><code>nome<\u002Fcode>, <code>uf<\u002Fcode>, <code>distanciaKm<\u002Fcode>, <code>valorKm<\u002Fcode>, <code>ativo<\u002Fcode><\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb put\">PUT<\u002Fspan><span class=\"ep-path\">/api/municipios-origem/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Atualiza um município. Mudança no valor por km é auditada.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb delete\">DELETE<\u002Fspan><span class=\"ep-path\">/api/municipios-origem/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Exclui um município de origem.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/municipios-destino<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Lista municípios de destino.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/municipios-destino/padrao<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Retorna o município de destino padrão.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/municipios-destino<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Cria um município de destino. Corpo: <code>nome<\u002Fcode>, <code>uf<\u002Fcode>, <code>padrao<\u002Fcode>.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb put\">PUT<\u002Fspan><span class=\"ep-path\">/api/municipios-destino/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Atualiza um município de destino.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb delete\">DELETE<\u002Fspan><span class=\"ep-path\">/api/municipios-destino/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Exclui um município de destino.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <h3>Cadastros — Categorias<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/categorias<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Lista categorias e seus parâmetros.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/categorias<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Cria categoria. Valida faixa de peso (mín &lt; máx), peso médio dentro da faixa e cabeças por caminhão &gt; 0.<\u002Fp>\n      <div class=\"lbl\">Corpo<\u002Fdiv><p><code>nome<\u002Fcode>, <code>pesoMin<\u002Fcode>, <code>pesoMax<\u002Fcode>, <code>pesoMedio<\u002Fcode>, <code>cabCaminhao<\u002Fcode>, <code>ordem<\u002Fcode>, <code>agioPadrao?<\u002Fcode><\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb put\">PUT<\u002Fspan><span class=\"ep-path\">/api/categorias/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Atualiza uma categoria.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb delete\">DELETE<\u002Fspan><span class=\"ep-path\">/api/categorias/{id}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Exclui uma categoria. Bloqueada se estiver em uso em itens de negociação (<code>400<\u002Fcode>).<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <h3>Cadastros — ICMS, Cotações e Comissão<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/icms<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Lista alíquotas de ICMS e recuperação por UF.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb put\">PUT<\u002Fspan><span class=\"ep-path\">/api/icms/{uf}<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Atualiza o ICMS de uma UF. Corpo: <code>aliquota<\u002Fcode>, <code>recuperacao<\u002Fcode>. Mudança de alíquota é auditada.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/cotacoes<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Lista cotações regionais (valor da arroba e ágios por categoria).<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/cotacoes/{uf}<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Obtém a cotação de uma UF. <code>404<\u002Fcode> se não cadastrada.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/cotacoes<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Cria/atualiza (upsert) a cotação de uma UF. Mudança no valor da arroba é auditada.<\u002Fp>\n      <div class=\"lbl\">Corpo<\u002Fdiv><p><code>uf<\u002Fcode>, <code>pracaReferenciaUf?<\u002Fcode>, <code>valorArroba<\u002Fcode>, <code>agios[]<\u002Fcode> (<code>categoriaId<\u002Fcode>, <code>percentual<\u002Fcode>)<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/config-comissao<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Obtém a configuração de comissão vigente.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/config-comissao<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Salva a configuração de comissão. Corpo: <code>percentual<\u002Fcode>, <code>ativo<\u002Fcode>. Mudança é auditada.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <h3>Auditoria<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/auditoria<\u002Fspan><span class=\"ep-auth admin\">Admin<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Lista o trilho de auditoria, paginado.<\u002Fp>\n      <div class=\"lbl\">Filtros (query)<\u002Fdiv><p><code>tabela<\u002Fcode>, <code>usuarioId<\u002Fcode>, <code>dataInicio<\u002Fcode>, <code>dataFim<\u002Fcode>, <code>pagina<\u002Fcode>, <code>tamanhoPagina<\u002Fcode><\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <h3>Simulação<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/simulacao<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Calcula o preço de praça por categoria para uma rota origem→destino.<\u002Fp>\n      <div class=\"lbl\">Corpo<\u002Fdiv><p><code>municipioOrigemId<\u002Fcode>, <code>municipioDestinoId<\u002Fcode>, <code>itens[]<\u002Fcode> (<code>categoriaId<\u002Fcode>, <code>precoColocado<\u002Fcode> R$/kg)<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/simulacao/oportunidades<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Ranking (Modo A — com ICMS) por categoria e preço colocado, ordenado pelo maior ágio.<\u002Fp>\n      <div class=\"lbl\">Query<\u002Fdiv><p><code>categoriaId<\u002Fcode>, <code>precoColocado<\u002Fcode> (&gt; 0)<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/simulacao/oportunidades-praca<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Ranking (Modo B — sem ICMS) ordenado pelo menor custo colocado. Origens sem cotação ativa são ignoradas.<\u002Fp>\n      <div class=\"lbl\">Query<\u002Fdiv><p><code>categoriaId<\u002Fcode><\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/simulacao/rapida<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Frete por kg de todas as categorias para uma rota. Query: <code>origemId<\u002Fcode>, <code>destinoId<\u002Fcode>.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <h3>Negociações<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/negociacoes<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Lista negociações paginadas.<\u002Fp>\n      <div class=\"lbl\">Filtros (query)<\u002Fdiv><p><code>compradorId<\u002Fcode>, <code>corretorId<\u002Fcode>, <code>categoria<\u002Fcode>, <code>uf<\u002Fcode>, <code>cidadeOrigem<\u002Fcode>, <code>status<\u002Fcode>, <code>pagina<\u002Fcode>, <code>tamanhoPagina<\u002Fcode><\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/negociacoes/{id}<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Obtém uma negociação completa (com itens).<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/negociacoes<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Cria uma negociação. Exige ao menos uma categoria com quantidade &gt; 0. O preço colocado de cada item é calculado automaticamente.<\u002Fp>\n      <div class=\"lbl\">Corpo<\u002Fdiv><p><code>compradorId<\u002Fcode>, <code>corretorId<\u002Fcode>, <code>municipioOrigemId<\u002Fcode>, <code>municipioDestinoId<\u002Fcode>, <code>dataPrevistaEntrega?<\u002Fcode>, <code>observacoes?<\u002Fcode>, <code>itens[]<\u002Fcode><\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb put\">PUT<\u002Fspan><span class=\"ep-path\">/api/negociacoes/{id}<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Atualiza uma negociação. Negociação fechada não pode ser editada. Comprador só edita as próprias (<code>403<\u002Fcode>). Alterações são auditadas item a item.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb delete\">DELETE<\u002Fspan><span class=\"ep-path\">/api/negociacoes/{id}<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Exclui uma negociação. Comprador só exclui as próprias (<code>403<\u002Fcode>).<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb post\">POST<\u002Fspan><span class=\"ep-path\">/api/negociacoes/{id}/fechar<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Fecha a negociação (status → <code>Fechado<\u002Fcode>). Já fechada retorna <code>400<\u002Fcode>.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb put\">PUT<\u002Fspan><span class=\"ep-path\">/api/negociacoes/entrega<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Registra quantidades entregues por item. Disponível apenas para negociações fechadas. Atualiza o status de entrega de cada item.<\u002Fp>\n      <div class=\"lbl\">Corpo<\u002Fdiv><p><code>negociacaoId<\u002Fcode>, <code>itens[]<\u002Fcode> (<code>itemId<\u002Fcode>, <code>qtdEntregue<\u002Fcode>)<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <h3>Dashboard<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/dashboard/totais<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Totais consolidados (quantidade e preços médios ponderados) da base filtrada.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/dashboard/compradores<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Indicadores agregados por comprador.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/dashboard/compradores/{id}/negociacoes<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Negociações de um comprador específico.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/dashboard/compradores/{id}/categorias-corretor<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Distribuição por corretor e categoria das negociações do comprador.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/dashboard/corretores<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Indicadores agregados por corretor e categoria.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/dashboard/por-categoria<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Indicadores agregados por categoria.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/dashboard/por-categoria/{id}/detalhe<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Quebra de uma categoria por comprador e corretor.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/dashboard/resumo-cabecas<\u002Fspan><span class=\"ep-auth auth\">Autenticado<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Resumo de cabeças em andamento e fechadas, por categoria e total geral.<\u002Fp><\u002Fdiv><\u002Fdiv>\n\n  <h3>Diagnóstico<\u002Fh3>\n  <div class=\"ep\"><div class=\"ep-head\"><span class=\"verb get\">GET<\u002Fspan><span class=\"ep-path\">/api/debug/tz<\u002Fspan><span class=\"ep-auth public\">Público<\u002Fspan><\u002Fdiv>\n    <div class=\"ep-body\"><p>Compara fuso e horário do servidor (.NET) e do PostgreSQL. Útil para diagnosticar divergências de fuso horário.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 07 REGRAS DE CÁLCULO ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"sec-num\">07<\u002Fdiv><h1 class=\"sec-title\">Regras de Cálculo e Negócio<\u002Fh1><\u002Fdiv>\n  <p class=\"sec-intro\">Fórmulas do motor de precificação e validações de domínio.<\u002Fp>\n\n  <h3>Frete por quilograma<\u002Fh3>\n  <p>Base de todos os cálculos. Considera ida e volta (×2) e um fator de recuperação de 88%:<\u002Fp>\n  <div class=\"callout\">\n    <code>FreteKg = (DistânciaKm × 2 × ValorKm × 0,88) ÷ CabCaminhão ÷ PesoMédio<\u002Fcode>\n  <\u002Fdiv>\n\n  <h3>Direção 1 — Colocado → Praça (Simulação)<\u002Fh3>\n  <p>A partir do preço posto na fazenda, deduz frete, ICMS e comissão para chegar ao preço de praça:<\u002Fp>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:42%\">Passo<\u002Fth><th>Fórmula<\u002Fth><\u002Ftr>\n    <tr><td>Valor na compra<\u002Ftd><td><code>PrecoColocado − FreteKg<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>ICMS<\u002Ftd><td><code>ValorNaCompra × IcmsEfetivo<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Comissão<\u002Ftd><td><code>ValorNaCompra × (Percentual ÷ 100)<\u002Fcode> — se ativa<\u002Ftd><\u002Ftr>\n    <tr><td>Preço de praça<\u002Ftd><td><code>ValorNaCompra − ICMS − Comissão<\u002Fcode> (arredondado p/ baixo a 1 casa)<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Direção 2 — Negociado → Colocado (Negociações)<\u002Fh3>\n  <p>Cálculo inverso usado ao registrar itens de negociação. ICMS e comissão incidem sobre o preço negociado:<\u002Fp>\n  <div class=\"callout\">\n    <code>PrecoColocado = PrecoNegociado + FreteKg + (PrecoNegociado × IcmsEfetivo) + (PrecoNegociado × Comissão%)<\u002Fcode>\n  <\u002Fdiv>\n\n  <h3>Direção 3 — Cotação da praça (Modo B)<\u002Fh3>\n  <p>Custo de buscar o animal na origem, sem ICMS:<\u002Fp>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:42%\">Passo<\u002Fth><th>Fórmula<\u002Fth><\u002Ftr>\n    <tr><td>Cotação da praça (R$/kg)<\u002Ftd><td><code>(ValorArroba ÷ 30) × (1 + Ágio% da categoria)<\u002Fcode><\u002Ftd><\u002Ftr>\n    <tr><td>Custo colocado (R$/kg)<\u002Ftd><td><code>CotacaoPracaKg + FreteKg<\u002Fcode><\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Deságio (Modo A)<\u002Fh3>\n  <p>Compara o preço de praça calculado com a cotação <em>crua<\u002Fem> da praça (sem ágio):<\u002Fp>\n  <div class=\"callout\">\n    <code>Deságio% = (PrecoPraca ÷ (ValorArroba ÷ 30) − 1) × 100<\u002Fcode><br>\n    <span class=\"muted\">Positivo = pagando acima da praça (favorável). Negativo = abaixo.<\u002Fspan>\n  <\u002Fdiv>\n\n  <h3>Validações de negociação<\u002Fh3>\n  <ul>\n    <li>Pelo menos uma categoria deve ter quantidade de cabeças maior que zero.<\u002Fli>\n    <li>Observações são limitadas a 500 caracteres.<\u002Fli>\n    <li>Negociação <strong>fechada<\u002Fstrong> não pode ser editada.<\u002Fli>\n    <li>Comprador só pode editar/excluir negociações que criou; Admin não tem essa restrição.<\u002Fli>\n    <li>Controle de entrega disponível somente para negociações fechadas; <code>qtdEntregue<\u002Fcode> não pode ser negativa.<\u002Fli>\n    <li>Status de entrega: <code>Pendente<\u002Fcode> (0), <code>Concluido<\u002Fcode> (≥ negociada) ou <code>Parcial<\u002Fcode>.<\u002Fli>\n  <\u002Ful>\n\n  <div class=\"callout info\">\n    <div class=\"ct\">Auditoria automática<\u002Fdiv>\n    Criação, edição, exclusão, fechamento e entrega de negociações — bem como alterações de parâmetros (valor por km, ICMS, cotação, comissão) — são registradas na trilha de auditoria com usuário, valores anterior/novo e descrição.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 08 EXECUÇÃO ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"sec-num\">08<\u002Fdiv><h1 class=\"sec-title\">Execução e Configuração<\u002Fh1><\u002Fdiv>\n  <p class=\"sec-intro\">Como executar a API localmente e acessar a documentação interativa.<\u002Fp>\n\n  <h3>Pré-requisitos<\u002Fh3>\n  <ul>\n    <li>.NET SDK 8.0<\u002Fli>\n    <li>Acesso a uma instância PostgreSQL<\u002Fli>\n  <\u002Ful>\n\n  <h3>Executando<\u002Fh3>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:40%\">Comando<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>dotnet restore<\u002Ftd><td>Restaura os pacotes.<\u002Ftd><\u002Ftr>\n    <tr><td>dotnet build<\u002Ftd><td>Compila o projeto.<\u002Ftd><\u002Ftr>\n    <tr><td>dotnet run<\u002Ftd><td>Sobe a API.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Documentação interativa (Swagger)<\u002Fh3>\n  <p>Com a API em execução, a documentação OpenAPI fica disponível na rota <code>/swagger<\u002Fcode>. A interface inclui o botão <strong>Authorize<\u002Fstrong> para informar o token JWT e testar os endpoints protegidos diretamente do navegador.<\u002Fp>\n\n  <h3>Configuração por ambiente<\u002Fh3>\n  <p>As configurações sensíveis são fornecidas por variáveis de ambiente / arquivo de configuração do ambiente, <strong>não devendo ser versionadas com valores reais<\u002Fstrong>:<\u002Fp>\n  <table class=\"fields\">\n    <tbody><tr><th style=\"width:42%\">Chave<\u002Fth><th>Descrição<\u002Fth><\u002Ftr>\n    <tr><td>ConnectionStrings:DefaultConnection<\u002Ftd><td>String de conexão com o PostgreSQL.<\u002Ftd><\u002Ftr>\n    <tr><td>Jwt:Key<\u002Ftd><td>Chave secreta de assinatura do JWT.<\u002Ftd><\u002Ftr>\n    <tr><td>Jwt:Issuer / Jwt:Audience<\u002Ftd><td>Emissor e público do token.<\u002Ftd><\u002Ftr>\n    <tr><td>AllowedOrigins<\u002Ftd><td>Origens liberadas no CORS (separadas por vírgula).<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <div class=\"callout warn\">\n    <div class=\"ct\">Boas práticas de segurança<\u002Fdiv>\n    Mantenha string de conexão, credenciais e chave JWT fora do controle de versão (use variáveis de ambiente ou um gerenciador de segredos). Rotacione qualquer segredo que tenha sido exposto. Os valores reais foram omitidos desta documentação intencionalmente.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 09 SUPORTE ============ -->\n<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"sec-num\">09<\u002Fdiv><h1 class=\"sec-title\">Suporte e Considerações Finais<\u002Fh1><\u002Fdiv>\n  <p class=\"sec-intro\">Canais de apoio e encerramento.<\u002Fp>\n\n  <p>Esta documentação descreve a superfície técnica da API de Originação na sua versão <strong>v1<\u002Fstrong>. Para a documentação sempre atualizada e testável, consulte o <strong>Swagger<\u002Fstrong> da própria aplicação em <code>/swagger<\u002Fcode>, que reflete o código em execução.<\u002Fp>\n\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"c-tag\">Documentação viva<\u002Fdiv><div class=\"c-title\">Swagger / OpenAPI<\u002Fdiv>Disponível em <code>/swagger<\u002Fcode> com todos os endpoints, esquemas e autenticação JWT integrada.<\u002Fdiv>\n    <div class=\"card\"><div class=\"c-tag\">Suporte<\u002Fdiv><div class=\"c-title\">Equipe técnica<\u002Fdiv>Em caso de dúvidas sobre integração ou comportamento da API, acione a equipe de desenvolvimento responsável.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout\">\n    <div class=\"ct\">Versionamento<\u002Fdiv>\n    Alterações de contrato devem ser refletidas tanto no código (comentários XML / anotações) quanto nesta documentação, mantendo ambas as fontes consistentes.\n  <\u002Fdiv>\n\n  <p class=\"muted\" style=\"margin-top:10mm; text-align:center;\">© 2026 Grupo Facholi — Sementes e Nutrição · Documentação Técnica da API de Originação de Gado<\u002Fp>\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
